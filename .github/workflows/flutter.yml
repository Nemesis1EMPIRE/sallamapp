name: Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java (pour Android)
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.16.0'  # Version spécifique
      
    - name: Show Flutter version
      run: flutter --version
      
    - name: Flutter pub get
      run: flutter pub get
      
    - name: Flutter analyze
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
